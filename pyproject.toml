[project]
name = "yeelight-voice"
version = "0.1.0"
description = "Voice-controlled Yeelight smart bulbs powered by LLM and speech recognition"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "python-dotenv",
    "openai",
    "yeelight",
]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
